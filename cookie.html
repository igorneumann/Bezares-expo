<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Autorizar dispositivo</title>
<style>
  :root { --blue:#00567D; --sky:#009FE3; --ink:#1d2a33; --bg:#f3f6f8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  .card { width:100%; max-width:420px; background:#fff; border-radius:16px; padding:32px 28px;
          box-shadow:0 10px 30px rgba(0,40,60,.12); text-align:center; }
  svg { width:56px; height:72px; color:var(--blue); }
  h1 { font-size:1.35rem; margin:.6rem 0 .3rem; }
  p { margin:.2rem 0 1.2rem; color:#55656f; font-size:.95rem; }
  label { display:block; text-align:left; font-size:.85rem; font-weight:600; margin-bottom:.3rem; }
  input { width:100%; font-size:1.1rem; padding:.75rem .9rem; border:1px solid #c7d2d9; border-radius:10px; }
  input:focus { outline:3px solid rgba(0,159,227,.35); border-color:var(--sky); }
  button { margin-top:1rem; width:100%; font-size:1.05rem; font-weight:700; padding:.85rem; border:0; border-radius:10px;
           background:var(--blue); color:#fff; cursor:pointer; }
  button:hover { background:#00435f; }
</style>
</head>
<body>
<main class="card">
  <svg viewBox="0 0 48 64" aria-hidden="true"><rect x="3" y="2" width="42" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="3.5"/><rect x="9" y="9" width="30" height="42" rx="1.5" fill="currentColor" opacity=".18"/><circle cx="24" cy="56" r="2.6" fill="currentColor"/></svg>
  <h1>Autorizar este dispositivo</h1>
  <p>Añade la cookie de autorización para mostrar los productos de la feria en este tablet.</p>
  <form method="post" action="/cookie.php" autocomplete="off">
    <label for="code">Código de acceso</label>
    <input id="code" name="code" type="password" inputmode="text" maxlength="100" autocomplete="off">
    <button type="submit">Autorizar</button>
  </form>
</main>
</body>
</html>
